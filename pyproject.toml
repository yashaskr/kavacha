[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bengaluru-women-safety-data"
version = "0.1.0"
description = "Data-first collection pipeline for Bengaluru women's safety intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "certifi>=2024.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "tenacity>=8",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pdfplumber>=0.11",
  "python-dateutil>=2.9",
  "click>=8.1",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ws-data = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100